# FLIGHT OPS - redraw the strip nightly from live GitHub data.
#
# Runs just after midnight UTC so the panels show the day that just ended
# (the git-koi idea), and whenever the pipeline itself changes. Commits
# the rendered assets only when they changed, so quiet days add no noise.
name: Flight Ops

on:
  schedule:
    - cron: "35 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "data/snapshot.json"
      - "data/squadron.json"
      - ".github/workflows/flightops.yml"

permissions:
  contents: write

# Renders and the flyby bot both commit; serialize them so pushes never race.
concurrency:
  group: the-strip
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect the snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: DzKriMo
        run: node scripts/fetch.mjs

      - name: Paint the strip
        run: node scripts/render.mjs

      - name: Commit if the panels changed
        shell: bash
        run: |
          git add data/snapshot.json data/squadron.json assets/
          if git diff --cached --quiet; then
            echo "The strip is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "flight-ops: redraw the strip for $(date -u +%F)"
          git push --quiet
