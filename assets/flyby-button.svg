<svg xmlns="http://www.w3.org/2000/svg" width="260" height="46" viewBox="0 0 260 46" role="img">
<title>Request a flyby</title>
<desc>Button that opens a pre-filled issue to get a callsign on the flight log wall.</desc>
<rect x="1" y="1" width="258" height="44" rx="22" fill="#0d1117" stroke="#ffb86c" stroke-width="1.6"/>
  <g transform="translate(26,23) scale(0.62)">
    <path d="M46,0 L28,-4.5 L-20,-5.5 L-44,-3 L-44,3 L-20,6 L28,4.5 Z" fill="#ffb86c"/>
    <path d="M-30,-5 L-37,-16 L-45,-16 L-43,-3 Z" fill="#ffb86c" opacity="0.7"/>
    <path d="M31,-4.5 Q24,-10 13,-7.5 L18,-4.5 Z" fill="#0d1117" opacity="0.7"/>
    <circle cx="-44" cy="-16" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <rect x="-46" y="-2.4" width="1.6" height="1.6" fill="#ffb86c" opacity="0.6">
      <animate attributeName="x" values="-46;-66;-46" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="width" values="7;28;7" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="96" y="28" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#ffb86c">REQUEST A FLYBY</text>
</svg>
