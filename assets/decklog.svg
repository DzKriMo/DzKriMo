<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="316" viewBox="0 0 1000 316" role="img">
<title>ARIA deck log: the onboard AI reports on the pilot</title>
<desc>A terminal window where the onboard AI types a recon report with live GitHub stats.</desc>
<defs>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1117" stop-opacity="0.13"/>
    <stop offset="0.5" stop-color="#0d1117" stop-opacity="0"/>
    <stop offset="1" stop-color="#0d1117" stop-opacity="0.13"/>
  </linearGradient>
</defs>
<rect width="1000" height="316" fill="#eef3fa"/>
<rect x="20" y="20" width="960" height="276" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <circle cx="44" cy="38" r="5" fill="#ff5f56"/>
  <circle cx="62" cy="38" r="5" fill="#ffbd2e"/>
  <circle cx="80" cy="38" r="5" fill="#27c93f"/>
  <text x="500" y="42" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1" fill="#8b949e">aria@dz-kri: flight deck log</text>
  <text x="956" y="42" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b949e">v2.3</text>
  <line x1="20" y1="54" x2="980" y2="54" stroke="#21262d" stroke-width="1"/>

  <clipPath id="type0">
    <rect x="44" y="64" width="0" height="18">
      <animate attributeName="width" from="0" to="403.0" begin="0.25s" dur="1.09s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.8 1" keyTimes="0;1"/>
    </rect>
  </clipPath>
  <text x="48" y="78" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" clip-path="url(#type0)"><tspan fill="#3fb950">aria@dz-kri:~$ </tspan><tspan fill="#e6edf3">recon --target DzKriMo --depth full</tspan></text>
  <clipPath id="type1">
    <rect x="44" y="88" width="0" height="18">
      <animate attributeName="width" from="0" to="482.0" begin="1.56s" dur="1.30s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.8 1" keyTimes="0;1"/>
    </rect>
  </clipPath>
  <text x="48" y="102" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" clip-path="url(#type1)"><tspan fill="#8b949e">[boot] </tspan><tspan fill="#8b949e">ARIA v2.3 · reasoning engine online · sensors nominal</tspan></text>
  <clipPath id="type2">
    <rect x="44" y="112" width="0" height="18">
      <animate attributeName="width" from="0" to="584.7" begin="3.08s" dur="1.59s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.8 1" keyTimes="0;1"/>
    </rect>
  </clipPath>
  <text x="48" y="126" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" clip-path="url(#type2)"><tspan fill="#3fb950">[ ok ] </tspan><tspan fill="#e6edf3">identity ········ Akram Mehdi Amamra · CS Engineer · security + AI</tspan></text>
  <clipPath id="type3">
    <rect x="44" y="136" width="0" height="18">
      <animate attributeName="width" from="0" to="505.7" begin="4.89s" dur="1.37s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.8 1" keyTimes="0;1"/>
    </rect>
  </clipPath>
  <text x="48" y="150" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" clip-path="url(#type3)"><tspan fill="#3fb950">[ ok ] </tspan><tspan fill="#e6edf3">hangars ········· 36 public repos · 6 stars on the fence</tspan></text>
  <clipPath id="type4">
    <rect x="44" y="160" width="0" height="18">
      <animate attributeName="width" from="0" to="513.6" begin="6.48s" dur="1.39s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.8 1" keyTimes="0;1"/>
    </rect>
  </clipPath>
  <text x="48" y="174" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" clip-path="url(#type4)"><tspan fill="#3fb950">[ ok ] </tspan><tspan fill="#e6edf3">sorties ········· 143 contributions in the last 12 months</tspan></text>
  <clipPath id="type5">
    <rect x="44" y="184" width="0" height="18">
      <animate attributeName="width" from="0" to="410.9" begin="8.09s" dur="1.11s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.8 1" keyTimes="0;1"/>
    </rect>
  </clipPath>
  <text x="48" y="198" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" clip-path="url(#type5)"><tspan fill="#3fb950">[ ok ] </tspan><tspan fill="#e6edf3">streak ·········· 2 days hot · record 3 days</tspan></text>
  <clipPath id="type6">
    <rect x="44" y="208" width="0" height="18">
      <animate attributeName="width" from="0" to="584.7" begin="9.42s" dur="1.59s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.8 1" keyTimes="0;1"/>
    </rect>
  </clipPath>
  <text x="48" y="222" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" clip-path="url(#type6)"><tspan fill="#3fb950">[ ok ] </tspan><tspan fill="#e6edf3">emissions ······· HTML · JavaScript · Python · Kotlin · TypeScript</tspan></text>
  <clipPath id="type7">
    <rect x="44" y="232" width="0" height="18">
      <animate attributeName="width" from="0" to="561.0" begin="11.22s" dur="1.52s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.8 1" keyTimes="0;1"/>
    </rect>
  </clipPath>
  <text x="48" y="246" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" clip-path="url(#type7)"><tspan fill="#d29922">[ !! ] </tspan><tspan fill="#d29922">finding ········· activity comes in bursts · probably deadlines</tspan></text>
  <clipPath id="type8">
    <rect x="44" y="256" width="0" height="18">
      <animate attributeName="width" from="0" to="410.9" begin="12.97s" dur="1.11s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.8 1" keyTimes="0;1"/>
    </rect>
  </clipPath>
  <text x="48" y="270" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" clip-path="url(#type8)"><tspan fill="#3fb950">aria@dz-kri:~$ </tspan><tspan fill="#58a6ff">status → AIRBORNE · cleared to build</tspan></text>

  <!-- blinking cursor -->
  <rect x="456.9" y="260" width="8" height="15" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline shimmer -->
  <rect x="20" y="55" width="960" height="221" fill="url(#scan)">
    <animate attributeName="y" values="55;276;55" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>